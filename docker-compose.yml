name: bun-elysia-project

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bun-elysia-project:dev
    container_name: bun-elysia-project
    working_dir: /app

    env_file:
      - .env
    environment:
      - PORT=${PORT:-41102}

    ports:
      - '${PORT:-41102}:${PORT:-41102}'

    volumes:
      # Mount seluruh project (TERMASUK node_modules) supaya sinkron & kebaca VS Code
      - ./:/app

      # Cache bun (opsional, untuk mempercepat install bila kamu tetap install di container)
      - bun-cache:/root/.bun

    # Jalankan dev saja; dependency diharapkan sudah ter-install di host
    command: sh -c "bun run dev"

    restart: 'no'

volumes:
  bun-cache:
